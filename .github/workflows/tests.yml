name: Pocket AutoPilot tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node tests/ui_smoke_node.js
      - run: node tests/ui_observer_node.js

  real-ocr-synthetic-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POCKET_TEST_REAL_OCR: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por fonts-dejavu-core
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python -m unittest discover -s tests -p test_ocr_e2e.py -v
